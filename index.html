<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Cantinho 💕</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.1/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.6.1/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKeF8WWCd-aiph-e2YhnhuUzf9o26EKkQ",
            authDomain: "nosso-cantinho-64578.firebaseapp.com",
            databaseURL: "https://nosso-cantinho-64578-default-rtdb.firebaseio.com",
            projectId: "nosso-cantinho-64578",
            storageBucket: "nosso-cantinho-64578.appspot.com",
            messagingSenderId: "820005937946",
            appId: "1:820005937946:web:adebdd66f13b2179c582a3"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const auth = getAuth(app);

        window.database = database;
        window.ref = ref;
        window.push = push;
        window.onValue = onValue;
        window.auth = auth;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.signOut = signOut;
        window.onAuthStateChanged = onAuthStateChanged;
    </script>
</head>

<body>
    <!-- Login -->
    <div id="loginCard" class="login-card">
        <h2>Entrar no Cantinho 💕</h2>
        <form id="loginForm">
            <input type="email" id="emailInput" placeholder="Email" required>
            <input type="password" id="passwordInput" placeholder="Senha" required>
            <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
        <p id="loginError" class="hidden">Email ou senha incorretos 😢</p>
    </div>

    <!-- Blog -->
    <div id="blogContent" class="hidden">
        <header class="header">
            <div class="header-content">
                <h1>Nosso Cantinho</h1>
                <button id="logoutBtn" class="btn btn-secondary">Sair</button>
            </div>
        </header>

        <main class="container">
            <div class="new-post-card">
                <h2>✨ Romantize sua rotina aqui ✨</h2>
                <form id="postForm">
                    <textarea id="contentInput" placeholder="O que está acontecendo? 💭" rows="4" required></textarea>
                    <button type="submit" class="btn btn-primary">Postar</button>
                </form>
            </div>

            <div id="postsContainer" class="posts-container"></div>
            <div id="emptyState" class="empty-state hidden">
                <p>Nenhum post ainda... 🌸</p>
            </div>
        </main>
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
